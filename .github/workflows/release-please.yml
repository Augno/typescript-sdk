name: Release Please
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'augno/typescript-sdk'
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # Publish in the SAME job when release-please cuts a version, gated on its
      # release_created output. The built-in GITHUB_TOKEN can't fire the separate
      # publish-npm.yml's `release: published` trigger (and no RELEASE_PLEASE_TOKEN
      # PAT is set), so publishing here is what actually ships @augno/sdk +
      # @augno/sdk-mcp to npmjs. Reuses scripts/publish-packages.ts + bin/publish-npm
      # (which authenticate to npmjs with NPM_TOKEN).
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0

      - name: Set up Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install

      - name: Publish to NPM
        if: ${{ steps.release.outputs.release_created }}
        run: |
          PATHS_RELEASED='[\".\", \"packages/mcp-server\"]'
          pnpm tsn scripts/publish-packages.ts "{ \"paths_released\": \"$PATHS_RELEASED\" }"
        env:
          NPM_TOKEN: ${{ secrets.AUGNO_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Upload MCP Server DXT GitHub release asset
        if: ${{ steps.release.outputs.release_created }}
        continue-on-error: true
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} \
            packages/mcp-server/augno_sdk_api.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
