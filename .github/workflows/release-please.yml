name: Release Please
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'open-mrp/typescript-sdk'
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.release.outputs.releases_created == 'true' }}

      - name: Set up Node
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/

      - name: Set up pnpm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          pnpm install

      - name: Publish to NPM
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_RELEASED="[\\\"$INPUT_PATH\\\"]"
          else
            PATHS_RELEASED='[\".\", \"packages/mcp-server\"]'
          fi
          pnpm tsn scripts/publish-packages.ts "{ \"paths_released\": \"$PATHS_RELEASED\" }"
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
          # setup-node writes an .npmrc reading NODE_AUTH_TOKEN, and neither
          # bin/publish-npm nor publish-packages.ts sets credentials itself — so
          # without this the publish goes out anonymous and npm answers 404.
          NODE_AUTH_TOKEN: ${{ secrets.OPENMRP_NPM_TOKEN || secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.OPENMRP_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Upload MCP Server DXT GitHub release asset
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} \
            packages/mcp-server/openmrp_sdk_api.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
